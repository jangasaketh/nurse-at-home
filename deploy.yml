# Builds the Nurse at Home app and publishes it to GitHub Pages.
# This file must be saved in the repository as:  .github/workflows/deploy.yml

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Works whether the app is at the top of the repository or inside a folder.
      - name: Find the app folder
        id: app
        run: |
          config=$(git ls-files | grep -E '(^|/)next\.config\.mjs$' | head -1)
          if [ -z "$config" ]; then
            echo "next.config.mjs was not found. Upload it next to package.json." && exit 1
          fi
          echo "dir=$(dirname "$config")" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install and build
        working-directory: ${{ steps.app.outputs.dir }}
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          npm ci
          npm run build

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.app.outputs.dir }}/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
