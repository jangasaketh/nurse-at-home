# Keeps the free Supabase project awake: it pauses after 7 days without use.
# Once a day, reads the public list of cities (the same thing the apps read before sign-in).
# Not needed after moving to the Supabase Pro plan; it does no harm either way.
name: Keep the database awake

on:
  schedule:
    - cron: "17 3 * * *" # every day, 08:47 in India
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read the cities list
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hglhijvvbbmmsjoakvfz.supabase.co/rest/v1/cities?select=id&limit=1" \
            -H "apikey: sb_publishable_DTSf3sBH1uy9fDqFRcmIkA_4kyM3QxT")
          echo "Supabase answered $code"
          test "$code" = "200"
